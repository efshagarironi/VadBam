          cat > app/src/main/java/com/mylauncher/VadTile.java <<'EOF'
          package com.mylauncher;

          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;
          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;

          public class VadTile extends TileService {
              void upd() {
                  Tile t = getQsTile();
                  if (t == null) return;
                  boolean open = getSharedPreferences("l", 0).getBoolean("open", false);
                  t.setState(open ? Tile.STATE_ACTIVE : Tile.STATE_INACTIVE);
                  t.setLabel("Vad");
                  t.updateTile();
              }

              @Override
              public void onStartListening() { upd(); }

              @Override
              public void onClick() {
                  Tile t = getQsTile();
                  if (t != null) { t.setState(Tile.STATE_ACTIVE); t.updateTile(); }
                  Intent i = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (Build.VERSION.SDK_INT >= 34) {
                      startActivityAndCollapse(PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE));
                  } else {
                      startActivityAndCollapse(i);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/mylauncher/WatchService.java <<'EOF'
          package com.mylauncher;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;

          public class WatchService extends Service {
              Handler h = new Handler(Looper.getMainLooper());
              String target, fg = null;
              long start, last;
              boolean seen = false;
              int gone = 0;
              View overlay;

              Runnable r = new Runnable() {
                  public void run() { check(); h.postDelayed(this, 1000); }
              };

              @Override
              public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent i, int f, int id) {
                  target = i == null ? null : i.getStringExtra("pkg");
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("l", "VadLan", NotificationManager.IMPORTANCE_LOW));
                  Notification n = new Notification.Builder(this, "l")
                          .setSmallIcon(R.drawable.ic_tile)
                          .setContentTitle("VadLan")
                          .build();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(2, n);
                  }
                  if (target == null) { stopSelf(); return START_NOT_STICKY; }
                  addOverlay();
                  start = System.currentTimeMillis();
                  last = start - 3000;
                  seen = false;
                  gone = 0;
                  fg = null;
                  h.removeCallbacks(r);
                  h.post(r);
                  return START_NOT_STICKY;
              }

              void addOverlay() {
                  if (overlay != null || !Settings.canDrawOverlays(this)) return;
                  try {
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      overlay = new View(this);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(1, 1,
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                              PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP | Gravity.LEFT;
                      wm.addView(overlay, lp);
                  } catch (Exception e) { overlay = null; }
              }

              void removeOverlay() {
                  if (overlay == null) return;
                  try {
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      wm.removeView(overlay);
                  } catch (Exception e) { }
                  overlay = null;
              }

              boolean ignored(String p) {
                  return p != null && (p.equals("android") || p.startsWith("com.android.systemui")
                          || p.contains("permissioncontroller") || p.contains("documentsui")
                          || p.contains("intentresolver") || p.contains("packageinstaller")
                          || p.contains("inputmethod"));
              }

              void check() {
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (!pm.isInteractive()) return;
                  long now = System.currentTimeMillis();
                  try {
                      UsageStatsManager um = (UsageStatsManager) getSystemService(Context.USAGE_STATS_SERVICE);
                      UsageEvents ev = um.queryEvents(last, now);
                      UsageEvents.Event e = new UsageEvents.Event();
                      while (ev.hasNextEvent()) {
                          ev.getNextEvent(e);
                          if (e.getEventType() == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                              fg = e.getPackageName();
                          } else if (e.getEventType() == UsageEvents.Event.MOVE_TO_BACKGROUND
                                  && e.getPackageName().equals(fg)) {
                              fg = null;
                          }
                      }
                  } catch (Exception ex) { stopSelf(); return; }
                  last = now - 1000;
                  if (target.equals(fg)) {
                      seen = true;
                      gone = 0;
                  } else if (seen) {
                      if (ignored(fg)) {
                          gone = 0;
                      } else {
                          gone++;
                          if (gone >= 3) back();
                      }
                  } else if (now - start > 15000) {
                      stopSelf();
                  }
              }

              void back() {
                  h.removeCallbacks(r);
                  Intent i = new Intent(this, MainActivity.class)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          .putExtra("home", true);
                  try { startActivity(i); } catch (Exception e) { }
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  h.removeCallbacks(r);
                  removeOverlay();
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/mylauncher/ColorPicker.java <<'EOF'
          package com.mylauncher;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Shader;
          import android.view.MotionEvent;
          import android.view.View;

          public class ColorPicker extends View {
              public interface Listener { void onColor(int c); }

              float h = 0, s = 1, v = 1, side = 100;
              int a = 255, mode = 0;
              Listener l;
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

              public ColorPicker(Context c) { super(c); }

              public void setListener(Listener x) { l = x; }

              public void setColor(int c) {
                  float[] hsv = new float[3];
                  Color.colorToHSV(c, hsv);
                  h = hsv[0];
                  s = hsv[1];
                  v = hsv[2];
                  a = Color.alpha(c);
                  invalidate();
              }

              public int getColor() { return Color.HSVToColor(a, new float[]{h, s, v}); }

              float dp(float x) { return x * getResources().getDisplayMetrics().density; }

              float clamp(float f) { return Math.max(0f, Math.min(1f, f)); }

              @Override
              protected void onMeasure(int ws, int hs) {
                  int w = MeasureSpec.getSize(ws);
                  float sd = w - dp(46);
                  setMeasuredDimension(w, (int) (sd + dp(18) + dp(28) + dp(4)));
              }

              @Override
              protected void onDraw(Canvas c) {
                  float w = getWidth();
                  side = w - dp(46);
                  float hx = side + dp(14);
                  float ay = side + dp(18);
                  int hueCol = Color.HSVToColor(new float[]{h, 1f, 1f});

                  p.setStyle(Paint.Style.FILL);
                  p.setShader(new LinearGradient(0, 0, side, 0, Color.WHITE, hueCol, Shader.TileMode.CLAMP));
                  c.drawRoundRect(0, 0, side, side, dp(8), dp(8), p);
                  p.setShader(new LinearGradient(0, 0, 0, side, 0x00000000, 0xFF000000, Shader.TileMode.CLAMP));
                  c.drawRoundRect(0, 0, side, side, dp(8), dp(8), p);

                  int[] cols = new int[7];
                  for (int i = 0; i < 7; i++) cols[i] = Color.HSVToColor(new float[]{i * 60f, 1f, 1f});
                  p.setShader(new LinearGradient(0, 0, 0, side, cols, null, Shader.TileMode.CLAMP));
                  c.drawRoundRect(hx, 0, w, side, dp(8), dp(8), p);

                  p.setShader(null);
                  float cell = dp(7);
                  c.save();
                  c.clipRect(0, ay, w, ay + dp(28));
                  for (int i = 0; i * cell < w; i++) {
                      for (int j = 0; j < 4; j++) {
                          p.setColor(((i + j) % 2 == 0) ? 0xFFFFFFFF : 0xFFBBBBBB);
                          c.drawRect(i * cell, ay + j * cell, (i + 1) * cell, ay + (j + 1) * cell, p);
                      }
                  }
                  int solid = Color.HSVToColor(255, new float[]{h, s, v});
                  p.setShader(new LinearGradient(0, 0, w, 0, solid & 0x00FFFFFF, solid, Shader.TileMode.CLAMP));
                  c.drawRect(0, ay, w, ay + dp(28), p);
                  c.restore();
                  p.setShader(null);

                  p.setStyle(Paint.Style.STROKE);
                  float cx = s * side, cy = (1 - v) * side;
                  p.setStrokeWidth(dp(3));
                  p.setColor(0xFFFFFFFF);
                  c.drawCircle(cx, cy, dp(9), p);
                  p.setStrokeWidth(dp(1));
                  p.setColor(0xFF000000);
                  c.drawCircle(cx, cy, dp(10.5f), p);

                  float hy = h / 360f * side;
                  p.setStrokeWidth(dp(4));
                  p.setColor(0xFFFFFFFF);
                  c.drawLine(hx, hy, w, hy, p);
                  p.setStrokeWidth(dp(1));
                  p.setColor(0xFF000000);
                  c.drawLine(hx, hy - dp(2.5f), w, hy - dp(2.5f), p);
                  c.drawLine(hx, hy + dp(2.5f), w, hy + dp(2.5f), p);

                  float ax = a / 255f * w;
                  p.setStrokeWidth(dp(4));
                  p.setColor(0xFFFFFFFF);
                  c.drawLine(ax, ay, ax, ay + dp(28), p);
                  p.setStrokeWidth(dp(1));
                  p.setColor(0xFF000000);
                  c.drawLine(ax - dp(2.5f), ay, ax - dp(2.5f), ay + dp(28), p);
                  c.drawLine(ax + dp(2.5f), ay, ax + dp(2.5f), ay + dp(28), p);
                  p.setStyle(Paint.Style.FILL);
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  float w = getWidth();
                  float x = e.getX(), y = e.getY();
                  if (e.getAction() == MotionEvent.ACTION_DOWN) {
                      if (getParent() != null) getParent().requestDisallowInterceptTouchEvent(true);
                      if (y > side + dp(8)) mode = 2;
                      else if (x > side + dp(6)) mode = 1;
                      else mode = 0;
                  }
                  if (mode == 0) {
                      s = clamp(x / side);
                      v = 1 - clamp(y / side);
                  } else if (mode == 1) {
                      h = clamp(y / side) * 359.99f;
                  } else {
                      a = (int) (clamp(x / w) * 255);
                  }
                  invalidate();
                  if (l != null) l.onColor(getColor());
                  return true;
              }
          }
          EOF

          cat > app/src/main/java/com/mylauncher/MainActivity.java <<'EOF'
          package com.mylauncher;

          import android.app.*;
          import android.content.*;
          import android.content.pm.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.service.quicksettings.TileService;
          import android.text.*;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.widget.*;
          import java.util.*;
          import org.json.*;

          public class MainActivity extends Activity {
              static final int HOME = 0, SETTINGS = 1, BG = 2, BEHAVIOR = 3, LANG = 4, PICKER = 5, STAY = 6, DOCK = 7;

              static class AppItem { String label, pkg; Drawable icon; }

              static class Item {
                  boolean folder;
                  String pkg, id, name = "";
                  int color = 0x66FFFFFF;
                  List<String> apps = new ArrayList<>();
              }

              SharedPreferences sp;
              int bg, fgc, page = HOME, dockPage = 0;
              boolean fa, waitingOverlay = false, plusOpen = false, editName = false;
              final int[] colors = {0xFF2B2B2B, 0xFF3C3C3C, 0xFFF2F2F2, 0xFF000000,
                      0xFF1B2A3A, 0xFF1E3326, 0xFF3B1F24, 0xFF2E2140};
              final int[] fcolors = {0x66FFFFFF, 0x66000000, 0x66E53935, 0x66FB8C00, 0x66FDD835, 0x6643A047,
                      0x6600ACC1, 0x661E88E5, 0x665E35B1, 0x66D81B60, 0x668D6E63, 0x6690A4AE};

              List<Item> home = new ArrayList<>();
              List<List<String>> dock = new ArrayList<>();
              Set<String> sel = new LinkedHashSet<>();
              Map<String, View> cells = new HashMap<>();
              String openFolder = null, pickTarget = null;
              View normalBar, selBar;
              TextView selCount;
              FrameLayout dockHolder;

              List<AppItem> allApps = new ArrayList<>();
              List<String> added = new ArrayList<>();
              Set<String> selected = new LinkedHashSet<>();
              String query = "";
              LinearLayout listBox;
              TextView allText;
              View allDot;
              Button addBtn;

              String t(String f, String e) { return fa ? f : e; }

              // ================= lifecycle =================
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("l", 0);
                  fa = sp.getString("lang", "fa").equals("fa");
                  bg = sp.getInt("bg", colors[0]);
                  if (handleStay(getIntent())) { finish(); return; }
                  getWindow().setBackgroundDrawable(new ColorDrawable(0xFF000000));
                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                                  != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  loadHome();
                  loadDock();
                  notifyBar();
                  show();
              }

              @Override
              protected void onNewIntent(Intent in) {
                  super.onNewIntent(in);
                  setIntent(in);
                  if (handleStay(in)) return;
                  page = HOME;
                  openFolder = null;
                  plusOpen = false;
                  sel.clear();
                  show();
              }

              boolean handleStay(Intent in) {
                  if (in != null && in.getBooleanExtra("home", false)) {
                      sp.edit().remove("last").apply();
                      return false;
                  }
                  if (sp.getInt("stay", 0) != 1) return false;
                  String last = sp.getString("last", null);
                  if (last == null) return false;
                  Intent li = getPackageManager().getLaunchIntentForPackage(last);
                  if (li == null) return false;
                  startActivity(li);
                  return true;
              }

              @Override
              public void onRequestPermissionsResult(int c, String[] p, int[] r) { notifyBar(); }

              @Override
              protected void onStart() {
                  super.onStart();
                  sp.edit().putBoolean("open", true).apply();
                  requestTile();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  sp.edit().putBoolean("open", false).apply();
                  requestTile();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  stopService(new Intent(this, WatchService.class));
                  if (waitingOverlay) {
                      waitingOverlay = false;
                      if (hasUsage() && !Settings.canDrawOverlays(this)) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (page == HOME) {
                      if (!sel.isEmpty()) { sel.clear(); refreshCells(); updateSel(); }
                      else if (plusOpen) { plusOpen = false; show(); }
                      else if (openFolder != null) { openFolder = null; editName = false; show(); }
                      else super.onBackPressed();
                  } else if (page == BG || page == BEHAVIOR || page == LANG || page == STAY || page == DOCK) {
                      page = SETTINGS;
                      show();
                  } else {
                      pickTarget = null;
                      page = HOME;
                      show();
                  }
              }

              void requestTile() {
                  try {
                      TileService.requestListeningState(this, new ComponentName(this, VadTile.class));
                  } catch (Exception e) { }
              }

              void notifyBar() {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("l", "VadLan",
                          NotificationManager.IMPORTANCE_LOW));
                  Intent i = new Intent(this, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, i,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Intent i2 = new Intent(this, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          .putExtra("home", true);
                  PendingIntent pi2 = PendingIntent.getActivity(this, 1, i2,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, "l")
                          .setSmallIcon(R.drawable.ic_tile)
                          .setContentTitle("VadLan")
                          .setContentText(t("برای باز کردن لمس کنید", "Tap to open"))
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .addAction(new Notification.Action.Builder(
                                  Icon.createWithResource(this, R.drawable.ic_tile),
                                  t("صفحه اصلی", "Home"), pi2).build())
                          .build();
                  nm.notify(1, n);
              }

              // ================= data =================
              void loadHome() {
                  home.clear();
                  String s = sp.getString("home", null);
                  try {
                      if (s != null) {
                          JSONArray a = new JSONArray(s);
                          for (int i = 0; i < a.length(); i++) {
                              JSONObject o = a.getJSONObject(i);
                              Item it = new Item();
                              if (o.has("id")) {
                                  it.folder = true;
                                  it.id = o.getString("id");
                                  it.name = o.optString("n", "");
                                  it.color = o.optInt("c", 0x66FFFFFF);
                                  JSONArray ar = o.getJSONArray("a");
                                  for (int j = 0; j < ar.length(); j++) it.apps.add(ar.getString(j));
                              } else {
                                  it.pkg = o.getString("p");
                              }
                              home.add(it);
                          }
                      } else {
                          for (String x : sp.getString("apps", "").split(",")) {
                              if (x.isEmpty()) continue;
                              Item it = new Item();
                              it.pkg = x;
                              home.add(it);
                          }
                      }
                  } catch (Exception e) { }
              }

              void saveHome() {
                  try {
                      JSONArray a = new JSONArray();
                      for (Item it : home) {
                          JSONObject o = new JSONObject();
                          if (it.folder) {
                              o.put("id", it.id);
                              o.put("n", it.name);
                              o.put("c", it.color);
                              JSONArray ar = new JSONArray();
                              for (String p : it.apps) ar.put(p);
                              o.put("a", ar);
                          } else {
                              o.put("p", it.pkg);
                          }
                          a.put(o);
                      }
                      sp.edit().putString("home", a.toString()).apply();
                  } catch (Exception e) { }
              }

              void loadDock() {
                  dock.clear();
                  String s = sp.getString("dock", "");
                  for (String pg : s.split(";", -1)) {
                      List<String> l = new ArrayList<>();
                      for (String x : pg.split(",")) if (!x.isEmpty()) l.add(x);
                      dock.add(l);
                  }
              }

              void saveDock() {
                  StringBuilder b = new StringBuilder();
                  for (int i = 0; i < dock.size(); i++) {
                      if (i > 0) b.append(';');
                      b.append(String.join(",", dock.get(i)));
                  }
                  sp.edit().putString("dock", b.toString()).apply();
              }

              List<String> dockPageList(int i) {
                  while (dock.size() <= i) dock.add(new ArrayList<String>());
                  return dock.get(i);
              }

              Item findFolder(String id) {
                  for (Item it : home) if (it.folder && it.id.equals(id)) return it;
                  return null;
              }

              boolean installed(String p) {
                  try { getPackageManager().getApplicationInfo(p, 0); return true; }
                  catch (Exception e) { return false; }
              }

              Drawable icon(String p) {
                  try { return getPackageManager().getApplicationIcon(p); }
                  catch (Exception e) { return null; }
              }

              String label(String p) {
                  try {
                      PackageManager pm = getPackageManager();
                      return pm.getApplicationLabel(pm.getApplicationInfo(p, 0)).toString();
                  } catch (Exception e) { return p; }
              }

              // ================= helpers =================
              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              boolean isLight(int c) {
                  return (0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c)) > 150;
              }

              int solid(int c) {
                  int a = Color.alpha(c);
                  return Color.rgb(Color.red(c) * a / 255, Color.green(c) * a / 255, Color.blue(c) * a / 255);
              }

              boolean light() { return isLight(solid(bg)); }

              String hex(int c) { return String.format("#%08X", c); }

              GradientDrawable oval(int color) {
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(color);
                  return g;
              }

              LinearLayout vbox() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setBackgroundColor(bg);
                  l.setPadding(dp(16), dp(16), dp(16), dp(16));
                  return l;
              }

