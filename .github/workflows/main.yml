              // ================= dock =================
              View buildDock(int fg) {
                  dockHolder = new FrameLayout(this);
                  fillDock();
                  return dockHolder;
              }

              void fillDock() {
                  dockHolder.removeAllViews();
                  final int count = sp.getInt("dockCount", 5);
                  final int pages = sp.getInt("dockPages", 1);
                  int h = sp.getInt("dockH", 80);
                  int alpha = sp.getInt("dockA", 40);
                  int iconSz = sp.getInt("dockI", 44);
                  int wPct = sp.getInt("dockW", 100);
                  int sw = getResources().getDisplayMetrics().widthPixels - dp(24);
                  final int pageW = (int) (sw * wPct / 100f);
                  FrameLayout box = new FrameLayout(this);
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(dp(26));
                  int base = light() ? 0x000000 : 0xFFFFFF;
                  g.setColor(((alpha * 255 / 100) << 24) | base);
                  box.setBackground(g);
                  final HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  hs.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                  LinearLayout rowL = new LinearLayout(this);
                  rowL.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                  int total = 0;
                  int sz = Math.min(dp(iconSz), pageW / count - dp(6));
                  for (int pi = 0; pi < pages; pi++) {
                      LinearLayout pg = new LinearLayout(this);
                      pg.setGravity(Gravity.CENTER_VERTICAL);
                      final List<String> l = dockPageList(pi);
                      for (int k = 0; k < count; k++) {
                          FrameLayout slot = new FrameLayout(this);
                          if (k < l.size() && installed(l.get(k))) {
                              final String pkg = l.get(k);
                              total++;
                              ImageView iv = new ImageView(this);
                              iv.setImageDrawable(icon(pkg));
                              iv.setOnClickListener(w -> launchApp(pkg));
                              iv.setOnLongClickListener(w -> {
                                  new AlertDialog.Builder(this).setTitle(t("حذف از دوک؟", "Remove from dock?"))
                                          .setMessage(label(pkg))
                                          .setPositiveButton(t("حذف", "Remove"), (d, x) -> {
                                              l.remove(pkg);
                                              saveDock();
                                              fillDock();
                                          }).setNegativeButton(t("لغو", "Cancel"), null).show();
                                  return true;
                              });
                              slot.addView(iv, new FrameLayout.LayoutParams(sz, sz, Gravity.CENTER));
                          }
                          pg.addView(slot, new LinearLayout.LayoutParams(0, -1, 1));
                      }
                      rowL.addView(pg, new LinearLayout.LayoutParams(pageW, -1));
                  }
                  hs.addView(rowL);
                  hs.setOnTouchListener((w, ev) -> {
                      int a = ev.getAction();
                      if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                          w.postDelayed(() -> {
                              int p = Math.round(hs.getScrollX() / (float) pageW);
                              dockPage = Math.max(0, Math.min(pages - 1, p));
                              hs.smoothScrollTo(dockPage * pageW, 0);
                          }, 100);
                      }
                      return false;
                  });
                  hs.post(() -> hs.scrollTo(Math.min(dockPage, pages - 1) * pageW, 0));
                  box.addView(hs, new FrameLayout.LayoutParams(-1, -1));
                  if (total == 0) {
                      TextView hint = new TextView(this);
                      hint.setText(t("برنامه را نگه دارید و اینجا بکشید", "Hold an app and drag it here"));
                      hint.setTextSize(12);
                      hint.setTextColor(fgc);
                      hint.setAlpha(0.6f);
                      box.addView(hint, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));
                  }
                  box.setOnDragListener((w, ev) -> {
                      switch (ev.getAction()) {
                          case DragEvent.ACTION_DRAG_STARTED:
                              return true;
                          case DragEvent.ACTION_DRAG_ENTERED:
                              w.setAlpha(0.7f);
                              return true;
                          case DragEvent.ACTION_DRAG_EXITED:
                          case DragEvent.ACTION_DRAG_ENDED:
                              w.setAlpha(1f);
                              return true;
                          case DragEvent.ACTION_DROP:
                              w.setAlpha(1f);
                              addToDock(ev.getClipData().getItemAt(0).getText().toString());
                              return true;
                      }
                      return false;
                  });
                  dockHolder.addView(box, new FrameLayout.LayoutParams(pageW, dp(h), Gravity.CENTER_HORIZONTAL));
              }

              void addToDock(String pkg) {
                  int count = sp.getInt("dockCount", 5), pages = sp.getInt("dockPages", 1);
                  for (List<String> l : dock) {
                      if (l.contains(pkg)) {
                          Toast.makeText(this, t("قبلاً در دوک هست", "Already in dock"), Toast.LENGTH_SHORT).show();
                          return;
                      }
                  }
                  List<String> l = dockPageList(Math.min(dockPage, pages - 1));
                  if (l.size() >= count) {
                      Toast.makeText(this, t("این صفحه دوک پر است", "This dock page is full"), Toast.LENGTH_SHORT).show();
                      return;
                  }
                  l.add(pkg);
                  saveDock();
                  dockHolder.post(() -> fillDock());
              }

              // ================= launching =================
              void launchApp(String pkg) {
                  Intent li = getPackageManager().getLaunchIntentForPackage(pkg);
                  if (li == null) return;
                  int mode = sp.getInt("mode", 0);
                  if (mode == 2 && !hasWatchPerms()) { permDialog(); return; }
                  sp.edit().putString("last", pkg).apply();
                  if (mode == 2) {
                      Intent s = new Intent(this, WatchService.class).putExtra("pkg", pkg);
                      startForegroundService(s);
                  }
                  startActivity(li);
                  if (mode != 1) finish();
              }

              boolean hasUsage() {
                  AppOpsManager ao = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                  return ao.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS,
                          android.os.Process.myUid(), getPackageName()) == AppOpsManager.MODE_ALLOWED;
              }

              boolean hasWatchPerms() { return hasUsage() && Settings.canDrawOverlays(this); }

              void askPerms() {
                  if (!hasUsage()) {
                      waitingOverlay = true;
                      startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS));
                  } else if (!Settings.canDrawOverlays(this)) {
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())));
                  }
              }

