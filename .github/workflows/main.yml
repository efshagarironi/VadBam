              View slider(final String label, final String key, final int min, int max, int def,
                          final String unit, int fg) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(4), dp(14), dp(4), 0);
                  final TextView tv = new TextView(this);
                  tv.setTextColor(fg);
                  int cur = sp.getInt(key, def);
                  tv.setText(label + ": " + cur + unit);
                  SeekBar sb = new SeekBar(this);
                  sb.setMax(max - min);
                  sb.setProgress(cur - min);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          tv.setText(label + ": " + (p + min) + unit);
                          sp.edit().putInt(key, p + min).apply();
                      }
                      public void onStartTrackingTouch(SeekBar s) { }
                      public void onStopTrackingTouch(SeekBar s) { }
                  });
                  c.addView(tv);
                  c.addView(sb);
                  return c;
              }

              // ================= page switching =================
              void show() {
                  int fg = light() ? 0xFF202020 : 0xFFF2F2F2;
                  fgc = fg;
                  getWindow().setStatusBarColor(solid(bg));
                  getWindow().setNavigationBarColor(solid(bg));
                  int f = light() ? (View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR) : 0;
                  getWindow().getDecorView().setSystemUiVisibility(f);
                  View v;
                  if (page == SETTINGS) v = settingsPage(fg);
                  else if (page == BG) v = bgPage(fg);
                  else if (page == BEHAVIOR) v = behaviorPage(fg);
                  else if (page == STAY) v = stayPage(fg);
                  else if (page == DOCK) v = dockPage(fg);
                  else if (page == LANG) v = langPage(fg);
                  else if (page == PICKER) v = pickerPage(fg);
                  else v = homePage(fg);
                  v.setLayoutDirection(fa ? View.LAYOUT_DIRECTION_RTL : View.LAYOUT_DIRECTION_LTR);
                  setContentView(v);
              }

              // ================= home =================
              View homePage(final int fg) {
                  cells.clear();
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(bg);
                  root.setPadding(dp(12), dp(12), dp(12), dp(8));
                  FrameLayout head = new FrameLayout(this);
                  normalBar = topBar("VadLan", true, fg);
                  selBar = selectionBar(fg);
                  head.addView(normalBar, new FrameLayout.LayoutParams(-1, -2));
                  head.addView(selBar, new FrameLayout.LayoutParams(-1, -2));
                  root.addView(head);
                  boolean dockTop = sp.getInt("dockPos", 0) == 1;
                  LinearLayout.LayoutParams dl = new LinearLayout.LayoutParams(-1, -2);
                  dl.setMargins(0, dp(6), 0, dp(6));
                  View dockV = buildDock(fg);
                  if (dockTop) root.addView(dockV, dl);
                  FrameLayout mid = new FrameLayout(this);
                  mid.addView(gridScroll(fg), new FrameLayout.LayoutParams(-1, -1));
                  if (plusOpen) mid.addView(plusMenu(fg), new FrameLayout.LayoutParams(-1, -1));
                  if (openFolder != null) mid.addView(folderPopup(fg), new FrameLayout.LayoutParams(-1, -1));
                  root.addView(mid, new LinearLayout.LayoutParams(-1, 0, 1));
                  if (!dockTop) root.addView(dockV, dl);
                  updateSel();
                  return root;
              }

              View selectionBar(int fg) {
                  LinearLayout b = new LinearLayout(this);
                  b.setGravity(Gravity.CENTER_VERTICAL);
                  b.addView(btn("✕", fg, v -> { sel.clear(); refreshCells(); updateSel(); }));
                  selCount = new TextView(this);
                  selCount.setTextColor(fg);
                  selCount.setTextSize(18);
                  selCount.setGravity(Gravity.CENTER);
                  b.addView(selCount, new LinearLayout.LayoutParams(0, -2, 1));
                  b.addView(btn(t("پوشه جدید", "New folder"), fg, v -> addFolderDialog(new ArrayList<>(sel))));
                  b.addView(btn(t("حذف", "Remove"), fg, v -> {
                      home.removeIf(it -> !it.folder && sel.contains(it.pkg));
                      sel.clear();
                      saveHome();
                      show();
                  }));
                  return b;
              }

              void updateSel() {
                  boolean on = !sel.isEmpty();
                  normalBar.setVisibility(on ? View.GONE : View.VISIBLE);
                  selBar.setVisibility(on ? View.VISIBLE : View.GONE);
                  if (on) selCount.setText(String.valueOf(sel.size()));
              }

              void refreshCells() {
                  for (Map.Entry<String, View> e : cells.entrySet()) {
                      if (sel.contains(e.getKey())) {
                          GradientDrawable g = new GradientDrawable();
                          g.setCornerRadius(dp(14));
                          g.setColor(0x553D7BF7);
                          g.setStroke(dp(2), 0xFF3D7BF7);
                          e.getValue().setBackground(g);
                      } else {
                          e.getValue().setBackground(null);
                      }
                  }
              }

              void toggleSel(String pkg) {
                  if (!sel.remove(pkg)) sel.add(pkg);
                  refreshCells();
                  updateSel();
              }

              void dragStart(View w, String pkg) {
                  ClipData cd = ClipData.newPlainText("vad", pkg);
                  w.startDragAndDrop(cd, new View.DragShadowBuilder(w), pkg, 0);
              }

              LinearLayout cell(String pkg, int fg, int iconDp, int textSp) {
                  LinearLayout it = new LinearLayout(this);
                  it.setOrientation(LinearLayout.VERTICAL);
                  it.setGravity(Gravity.CENTER_HORIZONTAL);
                  it.setPadding(dp(4), dp(8), dp(4), dp(8));
                  ImageView iv = new ImageView(this);
                  iv.setImageDrawable(icon(pkg));
                  iv.setLayoutParams(new LinearLayout.LayoutParams(dp(iconDp), dp(iconDp)));
                  TextView tv = new TextView(this);
                  tv.setText(label(pkg));
                  tv.setTextColor(fg);
                  tv.setTextSize(textSp);
                  tv.setMaxLines(1);
                  tv.setEllipsize(TextUtils.TruncateAt.END);
                  tv.setGravity(Gravity.CENTER);
                  it.addView(iv);
                  it.addView(tv);
                  GridLayout.LayoutParams lp = new GridLayout.LayoutParams(
                          GridLayout.spec(GridLayout.UNDEFINED, 1f),
                          GridLayout.spec(GridLayout.UNDEFINED, 1f));
                  lp.width = 0;
                  it.setLayoutParams(lp);
                  return it;
              }

              View gridScroll(final int fg) {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(4);
                  grid.setPadding(0, dp(16), 0, dp(8));
                  int shown = 0;
                  for (final Item item : home) {
                      View c;
                      if (item.folder) {
                          c = folderCell(item, fg);
                      } else {
                          final String pkg = item.pkg;
                          if (!installed(pkg)) continue;
                          c = cell(pkg, fg, 56, 12);
                          cells.put(pkg, c);
                          c.setOnClickListener(w -> { if (sel.isEmpty()) launchApp(pkg); else toggleSel(pkg); });
                          c.setOnLongClickListener(w -> {
                              sel.add(pkg);
                              refreshCells();
                              updateSel();
                              dragStart(w, pkg);
                              return true;
                          });
                      }
                      grid.addView(c);
                      shown++;
                  }
                  col.addView(grid);
                  if (shown == 0) {
                      TextView e = new TextView(this);
                      e.setText(t("برای افزودن برنامه یا پوشه، دکمه + را بزنید", "Tap + to add apps or folders"));
                      e.setTextColor(fg);
                      e.setAlpha(0.7f);
                      e.setPadding(0, dp(24), 0, 0);
                      col.addView(e);
                  }
                  sv.addView(col);
                  refreshCells();
                  return sv;
              }

              View folderCell(final Item f, final int fg) {
                  LinearLayout it = new LinearLayout(this);
                  it.setOrientation(LinearLayout.VERTICAL);
                  it.setGravity(Gravity.CENTER_HORIZONTAL);
                  it.setPadding(dp(4), dp(8), dp(4), dp(8));
                  FrameLayout box = new FrameLayout(this);
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(dp(14));
                  g.setColor(f.color);
                  g.setStroke(dp(1), 0x33FFFFFF);
                  box.setBackground(g);
                  GridLayout mini = new GridLayout(this);
                  mini.setColumnCount(3);
                  int n = Math.min(9, f.apps.size());
                  for (int i = 0; i < n; i++) {
                      Drawable d = icon(f.apps.get(i));
                      if (d == null) continue;
                      ImageView iv = new ImageView(this);
                      iv.setImageDrawable(d);
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = dp(14);
                      lp.height = dp(14);
                      lp.setMargins(dp(1), dp(1), dp(1), dp(1));
                      iv.setLayoutParams(lp);
                      mini.addView(iv);
                  }
                  box.addView(mini, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));
                  it.addView(box, new LinearLayout.LayoutParams(dp(56), dp(56)));
                  TextView tv = new TextView(this);
                  tv.setText(f.name.isEmpty() ? t("پوشه", "Folder") : f.name);
                  tv.setTextColor(fg);
                  tv.setTextSize(12);
                  tv.setMaxLines(1);
                  tv.setEllipsize(TextUtils.TruncateAt.END);
                  tv.setGravity(Gravity.CENTER);
                  it.addView(tv);
                  GridLayout.LayoutParams lp = new GridLayout.LayoutParams(
                          GridLayout.spec(GridLayout.UNDEFINED, 1f),
                          GridLayout.spec(GridLayout.UNDEFINED, 1f));
                  lp.width = 0;
                  it.setLayoutParams(lp);
                  it.setOnClickListener(w -> { openFolder = f.id; editName = false; show(); });
                  it.setOnLongClickListener(w -> {
                      new AlertDialog.Builder(this).setTitle(t("حذف پوشه؟", "Delete folder?"))
                              .setMessage(t("برنامه‌های داخل آن به صفحه اصلی برمی‌گردند.", "Its apps go back to the home screen."))
                              .setPositiveButton(t("حذف", "Delete"), (d, x) -> {
                                  int idx = home.indexOf(f);
                                  home.remove(f);
                                  List<Item> back = new ArrayList<>();
                                  for (String p : f.apps) { Item a = new Item(); a.pkg = p; back.add(a); }
                                  home.addAll(Math.min(idx, home.size()), back);
                                  saveHome();
                                  show();
                              }).setNegativeButton(t("لغو", "Cancel"), null).show();
                      return true;
                  });
                  return it;
              }

