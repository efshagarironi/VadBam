                                  "Launcher Request needs two permissions: Usage access and Display over other apps. Find VadLan in the list and turn it on."))
                          .setPositiveButton(t("باز کردن تنظیمات", "Open settings"), (d, w) -> askPerms())
                          .setNegativeButton(t("لغو", "Cancel"), null).show();
              }

